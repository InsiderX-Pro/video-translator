interface:
  display_name: "Video Translator"
  short_description: "调用线上视频翻译服务并返回预览链接"
  default_prompt: "Use $video-translator to translate a user-provided video. Omit model for the default podcast product (target zh/en; target en needs source zh, target zh needs source en/ko/ja/fr/ru/es/de); send model=pro or model=normal for AI 视频直译 (source zh/ko/ja/en, target zh/ko/en/fr/es/th/vi/lo). Send show/bilingual subtitle flags when requested and return the final preview_url."
  required_env_vars:
    - "VIDEO_TRANSLATE_SERVICE_API_KEY"
  primary_credential: "VIDEO_TRANSLATE_SERVICE_API_KEY"
  external_service_domain: "audiox-api-global.luoji.cn"

policy:
  allow_implicit_invocation: true
